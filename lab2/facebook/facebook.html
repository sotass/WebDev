<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="left">
            <div class="logo-wrapper">
                <img src="facebook.svg" class="logo" alt="Facebook logo">
            </div>
            <h2 id="hero-text">
                Facebook помогает вам всегда оставаться на связи и общаться со своими знакомыми.
            </h2>
        </div>

        <div class="right">
            <div class="login">
            <form>
                <input type="text" name="email" placeholder="Электронный адрес или номер телефона">
                <input type="password" name="password" placeholder="Пароль">
                <input type="submit" value="Вход">
            </form>
                <a href="https://facebook.com" class="fp">Забыли пароль?</a>
                <hr>

                <div class="button">
                    <a class="button-text" href="https://facebook.com">Создать новый аккаунт?</a>
                </div>
            
        </div>
        <p class="cp">
            <a href="https://facebook.com" class="ll">Создать Страницу</a>
        знаменитости, музыкальной группы или компании.
        </p>
    </div>
</body>
</html>
